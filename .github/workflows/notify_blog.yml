name: Notify Blog

on:
  push:
    paths:
      - "**.md"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify frontend repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BLOG_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vansh0784/next_fe/dispatches \
            -d '{"event_type":"knowledge-updated"}'
